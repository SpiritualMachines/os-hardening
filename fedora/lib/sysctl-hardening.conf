# secure_oss sysctl hardening — Fedora Workstation / KDE Plasma
# Installed to /etc/sysctl.d/90-secure-oss.conf by harden.sh
#
# Sources: secureblue, Kicksecure, GrapheneOS, KSPP (Kernel Self Protection Project)
# Conservative desktop-appropriate subset: performance-critical settings like
# nosmt are excluded; focus is on network hardening and kernel information leaks.

# ===========================================================================
# Network hardening
# ===========================================================================

# Enable TCP SYN cookies — mitigates SYN flood DoS attacks
net.ipv4.tcp_syncookies = 1

# RFC 1337 fix — prevents time-wait assassination attacks
net.ipv4.tcp_rfc1337 = 1

# Disable TCP timestamps — prevents remote clock fingerprinting and uptime leakage
net.ipv4.tcp_timestamps = 0

# Disable ICMP echo (ping) responses — reduces network reconnaissance surface
net.ipv4.icmp_echo_ignore_all = 1
net.ipv6.icmp.echo_ignore_all = 1

# Disable ICMP redirect acceptance — prevents routing table manipulation
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Disable ICMP redirect sending — we are not a router
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Disable source routing — prevents IP source route spoofing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Reverse path filtering — drop packets with impossible source addresses
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Drop gratuitous ARP — prevents ARP cache poisoning
net.ipv4.conf.all.drop_gratuitous_arp = 1

# Log martian packets (impossible source/dest addresses) — aids anomaly detection
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# IPv6 privacy extensions — rotate temporary addresses, prefer them for outbound
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# Disable IPv6 router advertisements acceptance — we are not a router
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# ===========================================================================
# Kernel hardening
# ===========================================================================

# Restrict ptrace to parent processes only (Yama LSM)
# 1 = only parent can ptrace child (reasonable desktop default)
# 3 = no ptrace at all (breaks debuggers and some anti-cheat) — use 3 if desired
kernel.yama.ptrace_scope = 1

# Hide kernel symbol addresses from unprivileged users
kernel.kptr_restrict = 2

# Restrict kernel log access to root only
kernel.dmesg_restrict = 1

# Disable magic SysRq key — prevents direct kernel commands from keyboard
kernel.sysrq = 0

# Restrict unprivileged BPF — unprivileged eBPF has been a significant attack surface
kernel.unprivileged_bpf_disabled = 1

# Harden BPF JIT compiler — makes JIT spray attacks harder
net.core.bpf_jit_harden = 2

# Restrict perf event access — perf subsystem has many historical kernel vulns
kernel.perf_event_paranoid = 3

# Disable kexec — prevents replacing the running kernel (physical access attack)
kernel.kexec_load_disabled = 1

# Disable core dumps — prevents sensitive memory contents leaking to disk
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0

# Protect FIFO and regular files in world-writable sticky directories
# Prevents symlink/hardlink based privilege escalation in /tmp etc.
fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# Improve ASLR entropy (64-bit systems)
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16

# Disable unprivileged userfaultfd — has been exploited in local privilege escalation
vm.unprivileged_userfaultfd = 0

# Restrict TTY line discipline autoloading — prevents loading malicious line disciplines
dev.tty.ldisc_autoload = 0
