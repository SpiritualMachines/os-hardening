# secure_oss kernel module blacklist — Fedora Workstation / KDE Plasma
# Installed to /etc/modprobe.d/secure-oss-blacklist.conf by harden.sh
#
# Disables unused and historically vulnerable kernel modules.
# Based on secureblue, Kicksecure, and CIS Benchmark recommendations.
#
# NOTE: Bluetooth is NOT blacklisted here (unlike secureblue) because desktop
# users typically rely on Bluetooth for keyboards, mice, and headsets.
# Use optional/disable-bluetooth.sh if you want to disable it.

# ===========================================================================
# Unused / dangerous network protocols
# These have no legitimate use on a modern desktop but have been exploited
# via kernel vulnerabilities or network-based attacks.
# ===========================================================================

install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install n-hdlc /bin/false
install ax25 /bin/false
install netrom /bin/false
install x25 /bin/false
install rose /bin/false
install decnet /bin/false
install econet /bin/false
install af_802154 /bin/false
install ipx /bin/false
install appletalk /bin/false
install psnap /bin/false
install p8023 /bin/false
install p8022 /bin/false
install can /bin/false
install atm /bin/false

# ===========================================================================
# FireWire / Thunderbolt — DMA attack surface
# FireWire and Thunderbolt can be used for Direct Memory Access (DMA) attacks,
# allowing physical-access attackers to read/write arbitrary memory.
# Disable unless you actively use Thunderbolt peripherals (eGPU, docks, etc.)
# ===========================================================================

install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
install firewire-net /bin/false
install ohci1394 /bin/false
install sbp2 /bin/false
install dv1394 /bin/false
install raw1394 /bin/false
install video1394 /bin/false
# NOTE: thunderbolt is NOT blacklisted here because many modern laptops
# require it for USB-C/DisplayPort/charging. Add the following line if
# you have no Thunderbolt peripherals:
# install thunderbolt /bin/false

# ===========================================================================
# Unused / exotic filesystems
# These filesystems are rarely needed on a modern desktop. Disabling them
# reduces the attack surface for filesystem parsing vulnerabilities.
# ===========================================================================

install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install udf /bin/false
install cifs /bin/false
install nfs /bin/false
install nfsv3 /bin/false
install nfsv4 /bin/false
install ksmbd /bin/false
install gfs2 /bin/false
install reiserfs /bin/false
install jfs /bin/false
install xfs /bin/false
# NOTE: xfs is blacklisted above but Fedora's default filesystem is ext4.
# If your system uses XFS (check with: df -T /), comment out the xfs line.
install 9p /bin/false
install ceph /bin/false
install afs /bin/false
install ecryptfs /bin/false

# ===========================================================================
# Miscellaneous high-risk modules
# ===========================================================================

# vivid — Virtual Video Test Driver; has known exploit history (CVE-2020-10673)
install vivid /bin/false

# USB-based serial/gadget modules — not needed on typical desktops
# (leave commented out if you use USB serial devices like Arduino)
# install usb_storage /bin/false
