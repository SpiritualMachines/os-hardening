# secure_oss — pf anchor rules for macOS
# Loaded by the com.secure_oss.pf LaunchDaemon at boot and on demand.
# Purpose: Block Intel AMT/ME ports at the network layer as a defense-in-depth
#          measure alongside the Application Firewall.
#
# Intel Active Management Technology (AMT) operates at the NIC firmware level,
# below the OS. Blocking these ports at pf prevents OS-level responses but
# cannot stop AMT's shared-NIC mode from intercepting packets before pf sees them.
# Block at your router/gateway as the primary control; this is a secondary layer.
#
# AMT uses:
#   TCP 16992  — AMT HTTP management interface
#   TCP 16993  — AMT HTTPS management interface
#   TCP 16994  — AMT Redirection (SOL/IDE-R)
#   TCP 16995  — AMT Redirection over TLS
#   TCP 664    — DMTF DASH management (used by some AMT configurations)
#   UDP 623    — IPMI / AMT out-of-band discovery

# Block inbound AMT/ME connections
block drop in  proto tcp to any port { 16992 16993 16994 16995 664 }
block drop in  proto udp to any port 623

# Block outbound connections to AMT/ME on other hosts (same-subnet lateral reach)
block drop out proto tcp to any port { 16992 16993 16994 16995 664 }
block drop out proto udp to any port 623
